<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#0A1628;font-family:'Inter',sans-serif;
    color:#E8EEF6;position:relative;overflow:hidden}
  .glow{position:absolute;top:-220px;right:-140px;width:760px;height:760px;border-radius:50%;
    background:radial-gradient(circle,rgba(14,165,200,.22),transparent 62%)}
  .glow2{position:absolute;bottom:-300px;left:-180px;width:640px;height:640px;border-radius:50%;
    background:radial-gradient(circle,rgba(224,168,30,.14),transparent 62%)}
  .rail{position:absolute;left:0;top:0;bottom:0;width:8px;background:linear-gradient(#0EA5C8,#E0A81E)}
  .inner{position:relative;padding:74px 80px;height:100%;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:14px;font-family:'Space Grotesk';font-weight:600;font-size:22px}
  .dot{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0EA5C8,#E0A81E);
    display:grid;place-items:center;font-size:22px;color:#0A1628;font-weight:700}
  .eyebrow{margin-top:52px;display:inline-flex;align-items:center;gap:11px;font-size:16px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:#22C3E6;border:1px solid rgba(255,255,255,.14);
    padding:10px 20px;border-radius:100px;background:rgba(14,165,200,.07);align-self:flex-start}
  h1{font-family:'Space Grotesk';font-size:78px;font-weight:700;line-height:1.03;letter-spacing:-.025em;margin-top:26px}
  .campus{color:#8CA0B8}
  .arrow{color:#0EA5C8}
  .corp{background:linear-gradient(100deg,#22C3E6,#E0A81E);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stats{margin-top:auto;display:flex;gap:56px;padding-top:34px;border-top:1px solid rgba(255,255,255,.12)}
  .num{font-family:'Space Grotesk';font-size:40px;font-weight:700;color:#fff;line-height:1}
  .num em{font-style:normal;color:#0EA5C8}
  .lbl{font-size:16px;color:#8CA0B8;margin-top:8px}
</style>
</head>
<body>
  <div class="glow"></div><div class="glow2"></div><div class="rail"></div>
  <div class="inner">
    <div class="brand"><span class="dot">C</span>Campus to Corporate</div>
    <div class="eyebrow">2-Day Workshop · Complete Package</div>
    <h1>From the <span class="campus">campus</span><br><span class="arrow">→</span> to the <span class="corp">corporate floor</span>.</h1>
    <div class="stats">
      <div><div class="num">10</div><div class="lbl">Session decks</div></div>
      <div><div class="num">2</div><div class="lbl">Full days, 9–6</div></div>
      <div><div class="num">4</div><div class="lbl">Trainer documents</div></div>
      <div><div class="num"><em>100+</em></div><div class="lbl">Slides, all animated</div></div>
    </div>
  </div>
</body>
</html>
